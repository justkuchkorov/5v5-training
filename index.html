<title>5v5 Training Library</title>
<script>
/* =====================================================================
   DRILL DATA — edit or add drills here. Everything else reads from this.
   =====================================================================
   Pitch: 40 m (x) by 20 m (y). (0,0) = bottom-left corner. Your team attacks toward x = 40.

   One drill = {
     id, name, cat (sidebar group), role ('CM' | 'LW' | 'both'),
     min (fewest players needed, keeper included), players (text), diff (1 easy, 2 medium, 3 hard),
     improves, space, equip, setup, steps[], dose, points[], mistakes[], easier, harder,
     anim: {
       title, dur (seconds),
       cones: [[x,y],...],  zones: [[x0,y0,x1,y1],...]  (shaded boxes),
       actors: { LABEL: {
           r:   'me' | 'mate' | 'opp' | 'gk' | 'neu'   (shirt colour),
           at:  [x,y] start,  f: facing in degrees (0 = toward x=40, 90 = toward y=20),
           idle:'stand' | 'soft' | 'ready' | any pose name,
           k:   [[time, x, y, gait, {f: facing}], ...]   "be at (x,y) at this time, moving with this gait"
                gaits: walk jog run sprint drive brake back shuffle jockey
                poses: stand soft ready plantL plantR slL slLd slR slRd fall shield lean ... (see POSE in the engine)
                f can be degrees, another actor's label, 'ball', or [x,y]
           acts:[[time, kind, arg, duration], ...]
                kinds: scan L/R, feint L/R, stepover L/R, point L/R, tackle L/R, dive L/R, hop height
       } },
       ball: { at:[x,y], segs: [[t0, t1, kind, byActor, [toX,toY], foot 'L'/'R', {options}], ...] },
             kinds: drib (ball follows the player's touches), pass, shot ({h: height, c: curve, st:'poke'|'laces'|'curl'}),
                    touch (short push), sole (foot stays on the ball and rolls it), stop (sole on a still ball),
                    roll (ball moves on its own)
       phases: [[t0, t1, name, what happens], ...]   captions and phase stepping
     }
   }
   Kicks, touches and sole rolls are animated automatically from the ball segments.
   ===================================================================== */
const C1='Warm-up & injury prevention',C2='Speed & change of direction',C3='Ball mastery & close control',C4='Attacking 1v1',C5='Defending 1v1 & tracking',C6='First touch, scanning, passing',C7='Shooting in tight spaces',C8='Decision-making & trust',C9='Conditioning',C10='Recovery',C11='Build-up through the middle';
const DRILLS=[
/* ---------- 1. Warm-up and injury prevention ---------- */
{id:'1.1',name:'FIFA 11+ Part 1: running exercises',cat:C1,role:'both',min:2,players:'Pairs, any number',diff:1,
 improves:'Blood flow, hip mobility, landing control.',space:'25 m × 6 m lane',equip:'12 cones',
 setup:'Two lines of 6 cones: x = 8, 13, 18, 23, 28, 33 on y = 7 and the same on y = 13. Each pair of cones is one gate. Partners start at x = 8: A at (8, 7.5), B at (8, 12.5). Jog back on the outside (y = 5 and y = 15).',
 steps:['Straight ahead: jog together to the last gate, then jog back a little faster.','Hip out: at each cone stop, lift the knee forward, rotate it out to the side, put the foot down, continue.','Hip in: at each cone lift the knee out to the side, rotate it forward and in, put it down, continue.','Circling partner: at each gate shuffle sideways to meet in the middle, shuffle one full circle around each other, shuffle back.','Shoulder contact: at each gate shuffle to the middle, jump sideways into a light shoulder-to-shoulder bump, land on both feet with knees bent.','Quick forwards and backwards: sprint 2 cones forward, backpedal 1 cone, repeat to the end.'],
 dose:'Each exercise 2 lengths (2 sets); the jog back is the rest. About 8 minutes in total.',
 points:['Knees stay over your toes; never let them cave inward.','Land softly on the balls of your feet, hips and knees bent.','Trunk upright and stable on every shuffle and landing.'],
 mistakes:['Treating it as a chatty jog with sloppy form; the benefit comes from doing the movements properly.','Knees buckling inward on landings and side shuffles.'],
 easier:'Use 3 gates instead of 6 and skip the shoulder contact.',harder:'Run the return leg at 70–80% speed, or dribble a ball on the way back.',
 anim:{title:'One length of exercise 6 (quick forwards and backwards)',dur:22,
  cones:[[8,7],[13,7],[18,7],[23,7],[28,7],[33,7],[8,13],[13,13],[18,13],[23,13],[28,13],[33,13]],
  actors:{
   A:{r:'me',at:[8,7.5],k:[[1.8,18,7.5,'sprint'],[3.3,13,7.5,'back'],[5.1,23,7.5,'sprint'],[6.6,18,7.5,'back'],[8.4,28,7.5,'sprint'],[9.9,23,7.5,'back'],[11.7,33,7.5,'sprint'],[13.2,33.5,5,'jog'],[20.8,8.5,5,'jog'],[22,8,7.5,'jog']]},
   B:{r:'mate',at:[8,12.5],k:[[1.8,18,12.5,'sprint'],[3.3,13,12.5,'back'],[5.1,23,12.5,'sprint'],[6.6,18,12.5,'back'],[8.4,28,12.5,'sprint'],[9.9,23,12.5,'back'],[11.7,33,12.5,'sprint'],[13.2,33.5,15,'jog'],[20.8,8.5,15,'jog'],[22,8,12.5,'jog']]}},
  phases:[[0,1.8,'Sprint forward','A sprints from x = 8 to x = 18'],[1.8,3.3,'Brake and backpedal','Short braking steps, backpedal to x = 13'],[3.3,5.1,'Sprint forward','Sprint to x = 23'],[5.1,6.6,'Backpedal','Back to x = 18'],[6.6,8.4,'Sprint forward','Sprint to x = 28'],[8.4,9.9,'Backpedal','Back to x = 23'],[9.9,11.7,'Final sprint','Sprint to x = 33'],[11.7,22,'Jog back','Jog outside the lane back to the start']]}},

{id:'1.2',name:'FIFA 11+ Part 2: strength, plyometrics, balance',cat:C1,role:'both',min:2,players:'Pairs',diff:2,
 improves:'Core and leg strength, balance, safe landing.',space:'5 m × 5 m per pair',equip:'1 ball per pair',
 setup:'Pairs spread around the middle of the lane, for example A at (20, 9) and B at (20, 11.5), 2.5 m apart.',
 steps:['Front plank — L1 static hold · L2 alternate legs · L3 one leg lift and hold. 3 × 20–30 s.','Side plank — L1 static hold · L2 raise and lower hip · L3 with leg lift. 3 × 20–30 s each side.','Single-leg stance — L1 hold the ball · L2 throw the ball with partner · L3 partners try to push each other off balance. 2 × 30 s each leg.','Squats — L1 with toe raise · L2 walking lunges · L3 one-leg squats. 2 × 30 s.','Jumping — L1 vertical jumps · L2 lateral jumps (one leg to the other) · L3 box jumps (forward, back, sideways). 2 × 30 s.','The Nordic hamstring exercise also sits in Part 2; it has its own card (1.4).'],
 dose:'Pick the level you can do with good form. Planks 3 × 20–30 s; the rest 2 × 30 s.',
 points:["Plank: one straight line from head to heels; don't let the hips sag.",'Squats and landings: knee points over the second toe.','Jumps: land softly and hold the landing for a moment before the next jump.'],
 mistakes:['Jumping to a harder level before Level 1 looks clean.','Locked, straight-legged landings.'],
 easier:'Stay on Level 1 for every exercise for the first 2 weeks.',harder:'Move one level up when you can do 2 sets with perfect form.',
 anim:{title:'One rep of lateral jumps (Level 2)',dur:3,
  actors:{
   A:{r:'me',at:[20,9],f:0,idle:'slR',k:[[.3,20,9,'slRd'],[.5,20,9.12,'slR'],[.7,20,10,'slL'],[.95,20,10,'slLd'],[1.3,20,10,'slL'],[1.55,20,10,'slLd'],[1.75,20,9.88,'slL'],[1.95,20,9,'slR'],[2.2,20,9,'slRd'],[2.6,20,9,'slR']],acts:[[.5,'hop',.22,.2],[1.75,'hop',.22,.2]]},
   B:{r:'mate',at:[20,11.5],f:0,idle:'slR',k:[[.3,20,11.5,'slRd'],[.5,20,11.62,'slR'],[.7,20,12.5,'slL'],[.95,20,12.5,'slLd'],[1.3,20,12.5,'slL'],[1.55,20,12.5,'slLd'],[1.75,20,12.38,'slL'],[1.95,20,11.5,'slR'],[2.2,20,11.5,'slRd'],[2.6,20,11.5,'slR']],acts:[[.5,'hop',.22,.2],[1.75,'hop',.22,.2]]}},
  phases:[[0,.3,'Load','Standing on the right leg, bend hip and knee'],[.3,.5,'Push off','Drive sideways off the right leg'],[.5,.7,'Flight','Travel about 1 m to the left'],[.7,1.3,'Land and hold','Land on the left leg, knee over toe, hold'],[1.3,2.6,'Return','Repeat back to the right leg']]}},

{id:'1.3',name:'FIFA 11+ Part 3: running at speed',cat:C1,role:'both',min:1,players:'Any',diff:1,
 improves:'Readiness for sprints and cuts.',space:'40 m × 8 m',equip:'4 cones',
 setup:'Start cone at (2, 4), finish cone at (38, 4) for running and bounding. For plant and cut, cones at (5, 10), (15, 14), (25, 10), (35, 14).',
 steps:['Across the pitch: run from (2, 4) to (38, 4) at 75–80% of top speed, jog back.','Bounding: high, springy steps with a big knee lift and active arms; land gently on the ball of the foot. Jog back.','Plant and cut: jog 4–5 steps, plant on the right leg and cut left, accelerate 5–7 steps at 80–90%, slow down, plant on the left leg and cut right. Repeat to the end.'],
 dose:'Each exercise 2 sets; about 2 minutes.',
 points:['Upright body, quick arms on the run.','On the cut, the plant foot lands outside your body with the knee over the toe.','Slow down with short steps before each cut.'],
 mistakes:['Going flat out (100%) here; this part gets you ready, it does not test you.','Planting with a straight leg and the knee caving in.'],
 easier:'Run at 60–70% and skip bounding.',harder:'React to a partner pointing left or right for each cut.',
 anim:{title:'Plant and cut, one length',dur:10,cones:[[5,10],[15,14],[25,10],[35,14]],
  actors:{A:{r:'me',at:[2,10],k:[[1.5,5,10,'jog'],[1.8,5.2,10.15,'plantR'],[3.4,14,13.7,'run'],[4,15,14,'brake'],[4.3,15.2,13.85,'plantL'],[5.9,24,10.3,'run'],[6.5,25,10,'brake'],[6.8,25.2,10.15,'plantR'],[8.6,34,13.7,'run'],[9.5,35,14,'brake']]}},
  phases:[[0,1.5,'Jog in','A jogs from (2, 10) to (5, 10)'],[1.5,1.8,'Plant right, cut left','Right foot plants at (5, 10), hips turn toward +y'],[1.8,3.4,'Accelerate','Run to (14, 13.7)'],[3.4,4,'Brake','Short steps to (15, 14)'],[4,4.3,'Plant left, cut right','Left foot plants, hips turn toward −y'],[4.3,9.5,'Accelerate and repeat','Through (25, 10) to (35, 14), then jog back']]}},

{id:'1.4',name:'Nordic hamstring exercise',cat:C1,role:'both',min:2,players:'Pairs',diff:3,
 improves:'Hamstring strength while lengthening, which protects you in sprints. Extra important for the LW (more sprints).',space:'2 m × 1 m',equip:'Soft surface (grass, or a folded jacket on a court)',
 setup:"A kneels at (20, 10) facing +x. Partner P kneels behind at (19.3, 10) and holds A's ankles to the ground.",
 steps:['Kneel upright, body straight from knees to head, hands ready in front of the chest.','Lean forward as slowly as you can, braking with your hamstrings.',"When you can't hold any more, fall onto your hands into a push-up position.",'Push yourself back up to kneeling (use your hands as much as you need).'],
 dose:"FIFA 11+ levels — Level 1: 1 set of 3–5 reps. Level 2: 7–10 reps. Level 3: 12–15 reps. Start at Level 1 for 2–3 weeks. Expect sore hamstrings for the first week; don't start this the day before a big game.",
 points:['Keep a straight line from knee to shoulder; the hips must not bend.','Fight gravity for as long as possible; aim for 3–4 seconds of lowering.',"Partner pins the ankles firmly so the heels don't lift."],
 mistakes:['Bending at the hips (sticking the bum out) to make it easier.','Falling fast after the first few degrees instead of braking all the way.'],
 easier:'Lower only part of the way (about 30–45°) and push back up.',harder:'Move up a level, or pause for 2 s at the hardest angle before falling.',
 anim:{title:'One rep',dur:6,
  actors:{A:{r:'me',at:[20,10],f:0,idle:'nordic0',k:[[.5,20,10,'nordic0'],[2,20,10,'nordic1'],[3.5,20,10,'nordic2'],[4,20,10,'nordicC'],[5.5,20,10,'nordic0']]},
   P:{r:'mate',at:[19.3,10],f:0,idle:'kneelHold'}},
  phases:[[0,.5,'Set','Kneeling upright, trunk vertical'],[.5,3.5,'Slow lower','Trunk rotates forward around the knees, from vertical to about 30° above the ground'],[3.5,4,'Catch','Hands catch in push-up position'],[4,5.5,'Return','Push back to kneeling']]}},

{id:'1.5',name:'Copenhagen adduction',cat:C1,role:'both',min:2,players:'Pairs',diff:3,
 improves:'Inner-thigh (adductor) strength, which protects against groin pain from kicking and cutting.',space:'2 m × 2 m',equip:'None',
 setup:"A lies on the left side at (20, 10), body along the x axis, left forearm under the shoulder. Partner P stands at (21.2, 10) and holds A's right (top) leg at hip height.",
 steps:['Short lever: P holds the top leg at the knee. Long lever (harder): P holds at the ankle.','Lift your body into a side plank; at the same time bring the bottom leg up to touch the top foot.','Lower your body and bottom leg slowly (about 3 s) until they almost touch the ground.','Repeat, then switch sides.'],
 dose:'Start with 1–2 sets of 3–5 reps per side, short lever, twice a week. Build over 6–8 weeks toward three sessions a week, then keep it going once a week.',
 points:['Straight line from head to feet; hips stay stacked.','Lower slowly; the lowering is where the strength comes from.','Partner keeps the top leg at your hip height the whole time.'],
 mistakes:['Hips sagging or rolling backward.','Doing too many reps in week 1 and getting very sore inner thighs.'],
 easier:"Short lever, or hold a static side plank with the top leg on the partner's knee for 15–20 s.",harder:'Long lever, and hold 2 s at the top of each rep.',
 anim:{title:'One rep (short lever)',dur:5.5,
  actors:{A:{r:'me',at:[20.45,10],f:90,idle:'copLow',k:[[.5,20.45,10,'copLow'],[1.5,20.45,10,'copHigh'],[2,20.45,10,'copHigh'],[5,20.45,10,'copLow']]},
   P:{r:'mate',at:[21.45,10.1],f:180,idle:'holdLeg'}},
  phases:[[0,.5,'Set','Lying on the side, top leg held'],[.5,1.5,'Lift','Hips rise; bottom leg rises to meet the top foot'],[1.5,2,'Hold','Straight side plank'],[2,5,'Slow lower','Body and bottom leg lower until just above the ground']]}},

/* ---------- 2. Acceleration, deceleration and change of direction ---------- */
{id:'2.1',name:'Short acceleration starts',cat:C2,role:'both',min:1,players:'Solo or pairs',diff:1,
 improves:'First 3 steps, 0–10 m acceleration (LW: beating a man; CM: closing down).',space:'15 m × 10 m',equip:'6 cones',
 setup:'Three lanes. Start cones at (5, 6), (5, 10), (5, 14). Finish cones at (15, 6), (15, 10), (15, 14). 10 m sprints.',
 steps:['Rep 1–2: falling start. Stand tall, lean forward from the ankles until you have to step, then sprint.','Rep 3: lying face down, head toward the finish; push up and sprint.','Rep 4: standing with your back to the finish; turn and sprint.','Rep 5: side-on, shuffle 2 steps, then turn and sprint.','Sprint through the finish cones, slow down over 5 m, walk back.'],
 dose:'2 sets × 5 reps of 10 m at max effort. 60 s rest between reps (the walk back plus a little), 2–3 min between sets.',
 points:['Lean forward from the ankles, not the waist.','First steps are short, powerful pushes back into the ground.','Drive the arms hard: elbow back, hand to chin height.'],
 mistakes:['Popping upright on the first step.','Reaching with long strides at the start.'],
 easier:'5 m sprints from a standing start.',harder:"Race a partner, and the one who reacts to the other's first movement must catch them.",

  actors:{A:{r:'me',at:[5,10],f:0,k:[[.6,5.15,10,'fall'],[1.1,6.8,10,'drive'],[2.4,15,10,'sprint'],[3.6,20,10,'brake']]}},
  phases:[[0,.6,'Lean','Standing at the start cone, body tips forward as one straight line'],[.6,1.1,'First steps','3 short, hard pushes, body at about 45°'],[1.1,2.4,'Acceleration','Body rises gradually, strides lengthen'],[2.4,3.6,'Slow down','Gradual braking past the finish']]}},

{id:'2.2',name:'Sprint to stop (braking)',cat:C2,role:'both',min:1,players:'Solo',diff:1,
 improves:'Stopping fast and under control, which sets up every cut and every defensive stop. CM especially: stopping in front of an attacker.',space:'20 m × 4 m',equip:'3 cones',
 setup:'Start cone at (5, 10). Stop zone between cones at (15, 10) and (17, 10): a 2 m box.',
 steps:['Sprint from the start cone.','Stop completely inside the stop zone in as few steps as you can.','Hold an athletic stance for 2 s: feet wide, hips low, chest up.','Walk back.'],
 dose:'2 sets × 5 reps. Week 1 at about 70% speed, then build to full speed. 45–60 s between reps.',
 points:['Lower your hips early and switch to short, quick steps.','Keep the chest over your knees; do not lean back.','Final step wide, both knees bent, weight on the whole foot.'],
 mistakes:['Stopping with one long, straight-legged heel stab.','Leaning the trunk backward and sliding past the zone.'],
 easier:'5 m approach at 60–70% speed.',harder:'A partner shouts “stop” at a random moment, or stop and immediately backpedal 3 m.',

  actors:{A:{r:'me',at:[5,10],f:0,k:[[1.7,14,10,'sprint'],[2.4,16,10,'brake'],[4.4,16,10,'ready']]}},
  phases:[[0,1.7,'Sprint','A accelerates from (5, 10) to (14, 10)'],[1.7,2.4,'Brake','4–5 short steps, hips drop'],[2.4,4.4,'Hold','Athletic stance inside the zone']]}},

{id:'2.3',name:'5-0-5 turns',cat:C2,role:'both',min:1,players:'Solo or pairs',diff:2,
 improves:'180° turns, the futsal “press and recover” action.',space:'20 m × 4 m',equip:'3 cones',
 setup:'Start cone (5, 10), timing cone (15, 10), turn line cone (20, 10).',
 steps:['Sprint from (5, 10) toward the turn line.','Brake over the last 3–4 steps, plant at x = 20 and turn 180°.','Sprint back through the timing cone at x = 15, then slow down.','Alternate the turning foot each rep.'],
 dose:'2 sets × 6 reps (3 turning off each foot). 60–90 s between reps.',
 points:['Brake early with short steps, hips low.','Turn on a wide, sideways plant foot with the knee over the toe.','Eyes and head lead the turn, then push hard back the way you came.'],
 mistakes:['Rounding the turn in a wide arc.','Always turning on your favourite side.'],
 easier:'90° cut instead: at x = 20 cut and run to (20, 15).',harder:'Do it with a ball: dribble in, sole-drag turn at x = 20, dribble out.',
 anim:{title:'One rep (turning off the left foot)',dur:5.3,cones:[[5,10],[15,10],[20,10]],
  actors:{A:{r:'me',at:[5,10],f:0,k:[[2.2,18.5,10,'sprint'],[2.7,19.7,10,'brake'],[3.1,19.75,10.1,'plantL',{f:-90}],[4.2,15,10,'sprint'],[5,11,10,'jog']]}},
  phases:[[0,2.2,'Sprint in','A sprints from (5, 10) to (18.5, 10)'],[2.2,2.7,'Brake','Short steps to (19.8, 10)'],[2.7,3.1,'Plant and turn','Left foot plants wide at (20, 10.3), body turns 180°'],[3.1,4.2,'Re-accelerate','Sprint back past (15, 10)'],[4.2,5,'Slow down','Jog to (11, 10)']]}},

{id:'2.4',name:'Mirror drill',cat:C2,role:'both',min:2,players:'Pairs',diff:2,
 improves:'Reacting to an opponent, the core of both beating and tracking a man in 5v5. CM as follower, LW as leader.',space:'5 m × 3 m',equip:'4 cones',
 setup:"Leader L's channel: cones at (21, 7.5) and (21, 12.5). Follower F's channel: cones at (19, 7.5) and (19, 12.5). Players face each other 2 m apart, each in their own 5 m channel.",
 steps:['Both start in the middle (y = 10), in athletic stance.','For 10 s, L shuffles, cuts and fakes along the channel, trying to get 1 m away from F.','F copies every move and tries to stay directly opposite.','Swap roles.'],
 dose:'4 × 10 s in each role, 40–50 s rest between efforts.',
 points:['Stay low with your feet wider than your shoulders.',"Follower watches the leader's hips, not the head or feet.","Short, fast shuffles; don't cross your feet."],
 mistakes:['Standing tall, which makes every push-off slow.','Follower biting on head and shoulder fakes.'],
 easier:'Leader goes at half speed with 2–3 changes only.',harder:'At the end of the 10 s, L sprints to a cone at (26, 10) and F tries to tag L first.',
 anim:{title:'First 3 s of one rep',dur:3.4,cones:[[21,7.5],[21,12.5],[19,7.5],[19,12.5]],
  actors:{L:{r:'me',at:[21,10],f:180,idle:'ready',k:[[.5,21,10,'ready'],[1.3,21,12,'shuffle'],[1.6,21,12.05,'plantR'],[2.6,21,8,'shuffle'],[3,21,8,'ready']]},
   F:{r:'opp',at:[19,10],f:0,idle:'ready',k:[[.7,19,10,'ready'],[1.5,19,11.8,'shuffle'],[1.85,19,11.85,'plantL'],[2.8,19,8.4,'shuffle'],[3,19,8.4,'ready']]}},
  phases:[[0,.5,'Set','L at (21, 10), F at (19, 10), both low'],[.5,1.3,'Leader shuffles','L shuffles to (21, 12); F follows to (19, 11.8), about 0.2 s behind'],[1.3,1.6,'Leader plants','L plants the outside foot'],[1.6,2.6,'Leader cuts back','L goes to (21, 8); F reacts to (19, 8.4)'],[2.6,3,'Leader holds','L stops; F stops']]}},

{id:'2.5',name:'Plyometric mini-circuit',cat:C2,role:'both',min:1,players:'Solo',diff:2,
 improves:'Spring, first-step power, safe landings.',space:'10 m × 4 m',equip:'2 cones',
 setup:'Two cones 1.5 m apart across the pitch, at (15, 9.25) and (15, 10.75), for the skater bounds.',
 steps:['Pogo hops: small, quick two-footed hops on the spot with stiff ankles.','Skater bounds: jump sideways from one cone to the other, landing on one leg, hold 1 s.','Single-leg hop and stick: 3 hops forward on one leg, hold the last landing for 2 s.'],
 dose:'Pogo hops 2 × 10; skater bounds 2 × 6 per side; single-leg hops 2 × 3 per leg. About 60–80 foot contacts in total. 60 s between sets. Twice a week, early in the session.',

  actors:{A:{r:'me',at:[15,9.25],f:0,idle:'slL',k:[[.3,15,9.25,'slLd'],[.5,15.05,9.45,'slL'],[.8,15.3,10.75,'slR'],[1.05,15.3,10.75,'slRd'],[1.8,15.3,10.75,'slR']],acts:[[.5,'hop',.3,.3]]}},
  phases:[[0,.3,'Load','On the left leg at the low cone, hips back'],[.3,.5,'Push','Drive sideways and slightly forward'],[.5,.8,'Flight','Arms swing across the body'],[.8,1.8,'Land and stick','Land on the right leg, hold']]}},

/* ---------- 3. Ball mastery and close control ---------- */
{id:'3.1',name:'Sole rolls and taps (on the spot)',cat:C3,role:'both',min:1,players:'Solo (everyone at once)',diff:1,
 improves:'Sole control and touch with both feet.',space:'3 m × 3 m each',equip:'1 ball each',
 setup:'Each player in their own 3 m box; example A with the ball at (10, 10), facing +x.',
 steps:['Toe taps: alternate the soles on top of the ball, quick and light.','Side sole rolls: roll the ball across your body with the right sole, stop it with the left inside, roll it back with the left sole.','V-pulls: pull the ball back with the right sole, push it diagonally forward-left with the inside of the same foot; repeat with the left.','Pull-push: pull back with the sole, push forward with the laces of the same foot; alternate feet.','Inside-inside: tap the ball between the insides of both feet, ball under your hips.','Sole roll and stop: roll forward with the sole, stop with the sole, change foot.'],
 dose:'6 moves × 30 s, 15 s rest between moves, 2 rounds (about 9 min).',

document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.code=='Space'){e.preventDefault();$('#play').click()}else if(e.code=='ArrowRight')stepPhase(1);else if(e.code=='ArrowLeft')stepPhase(-1)});

/* ---- Today's Session: block list + countdown, next drill loads automatically ---- */
const T={i:0,left:SESSION.blocks[0].min*60,run:false,end:0,ac:null,done:false};
function beep(n){try{T.ac=T.ac||new (window.AudioContext||window.webkitAudioContext)();for(let i=0;i<(n||1);i++){const o=T.ac.createOscillator(),g=T.ac.createGain();o.frequency.value=880;o.connect(g);g.connect(T.ac.destination);const t=T.ac.currentTime+i*.28;g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.start(t);o.stop(t+.24)}}catch(e){}}
function wake(on){try{if(on&&navigator.wakeLock)navigator.wakeLock.request('screen').then(l=>T.wl=l).catch(()=>{});else if(T.wl){T.wl.release();T.wl=null}}catch(e){}}
function loadBlock(i,restart){T.i=clamp(i,0,SESSION.blocks.length-1);const b=SESSION.blocks[T.i];
 if(restart!==false||T.left==null){T.left=b.min*60;if(T.run)T.end=Date.now()+T.left*1000}
 T.done=false;if(b.drills.length)selectDrill(b.drills[0],{keepView:true});renderSession()}
function renderSession(){const bs=SESSION.blocks,b=bs[T.i];let acc=0;
 const rows=bs.map((x,i)=>{const a=acc;acc+=x.min;return '<button class="blk'+(i==T.i?' on':i<T.i?' done':'')+'" data-blk="'+i+'"><small>'+fmt(a*60).replace(/^0/,'')+'–'+fmt(acc*60).replace(/^0/,'')+'<br>'+x.min+' min</small><span><b>'+esc(x.block)+(x.drills.length?' · '+x.drills.join(' + '):'')+'</b>'+esc(x.what)+'</span></button>'}).join('');
 $('#vSession').innerHTML='<div class="tc"><div class="bk">Block '+(T.i+1)+' of '+bs.length+' · '+esc(b.block)+'</div><div id="clock">'+fmt(T.left)+'</div>'+
 '<div class="wh">'+esc(b.what)+'</div><div class="who">'+esc(b.who)+'</div>'+
 '<div class="row">'+b.drills.map(id=>'<button class="b sm" data-drill="'+id+'" data-keep="1">Show '+id+'</button>').join('')+(b.drills.length?'<button class="b sm" id="tInfo">Drill details</button>':'')+'</div>'+
 '<div class="row"><button class="b" id="tPrev">◀ Prev</button><button class="b go" id="tGo">'+(T.run?'❚❚ Pause':T.done?'Restart':'▶ Start')+'</button><button class="b" id="tNext">Next ▶</button><button class="b" id="tReset">Reset</button></div>'+
 '<div id="tot"><i></i></div></div>'+
 '<p class="note">'+esc(SESSION.intro)+'</p>'+rows+
 '<details><summary>What to bring and where the cones go</summary><p>'+esc(SESSION.bring)+'</p><table><tr><th>Block</th><th>Cones</th><th>Positions</th></tr>'+SESSION.cones.map(c=>'<tr><td>'+esc(c[0])+'</td><td>'+esc(c[1])+'</td><td>'+esc(c[2])+'</td></tr>').join('')+'</table></details>'+
 '<p class="note">'+link(SESSION.note)+'</p>';
 $('#tPrev').onclick=()=>loadBlock(T.i-1);$('#tNext').onclick=()=>loadBlock(T.i+1);
 $('#tReset').onclick=()=>{T.run=false;wake(false);loadBlock(0)};
 $('#tGo').onclick=()=>{if(T.done){T.done=false;T.run=true;loadBlock(0);wake(true);return}T.run=!T.run;if(T.run){T.end=Date.now()+T.left*1000;beep(1);wake(true)}else wake(false);renderSession()};
 const ti=$('#tInfo');if(ti)ti.onclick=()=>setView('drill');
 $$('.blk').forEach(x=>x.onclick=()=>loadBlock(+x.dataset.blk));clockUI()}
function clockUI(){const c=$('#clock');if(!c)return;c.textContent=T.done?'DONE':fmt(T.left);const tot=SESSION.blocks.reduce((a,b)=>a+b.min*60,0),before=SESSION.blocks.slice(0,T.i).reduce((a,b)=>a+b.min*60,0);
 const bar=$('#tot i');if(bar)bar.style.width=(T.done?100:(before+SESSION.blocks[T.i].min*60-T.left)/tot*100)+'%'}
setInterval(()=>{if(!T.run)return;T.left=(T.end-Date.now())/1000;
 if(T.left<=0){if(T.i<SESSION.blocks.length-1){beep(2);T.left=null;loadBlock(T.i+1)}else{T.run=false;T.done=true;T.left=0;beep(3);wake(false);renderSession()}}
 clockUI()},250);

/* ---- 4-week plan checklist (ticks saved in this browser) ---- */
let trackF='all';
function renderPlan(){let tot=0,done=0,html='';
 for(const w of PLAN.weeks){let ws='';for(const s of w.sessions){if(trackF!='all'&&!s.track.includes(trackF))continue;let c=0;
   const rows=PLAN.fields.map(f=>{const k='s'+s.n+'.'+f[0],on=!!S.plan[k];tot++;if(on){done++;c++}return '<label class="ck'+(on?' done':'')+'"><input type="checkbox" data-k="'+k+'"'+(on?' checked':'')+'><span><b>'+f[1]+'</b>'+link(s[f[0]])+'</span></label>'}).join('');
   ws+='<div class="ses'+(c==PLAN.fields.length?' full':'')+'"><header>Session '+s.n+' · '+s.date+(c==PLAN.fields.length?' · done ✔':'')+'<span class="tk '+s.track+'">'+s.track+' day</span></header>'+rows+'</div>'}
  if(ws)html+='<h3>'+esc(w.title)+'</h3>'+ws}
 $('#vPlan').innerHTML='<div class="dh"><span class="id">4 wk</span><h2>4-week plan for 3 players</h2></div>'+
 '<div class="seg" id="fTrack"><span>Track</span>'+[['all','All'],['CM','CM days'],['LW','LW days']].map(o=>'<button data-v="'+o[0]+'"'+(trackF==o[0]?' class="on"':'')+'>'+o[1]+'</button>').join('')+'</div>'+
 '<p class="bar">'+done+' of '+tot+' items ticked</p><div id="tot" style="background:#c9d0d9"><i style="width:'+(tot?done/tot*100:0)+'%;background:var(--grn)"></i></div>'+
 '<details><summary>How the plan works</summary><p>'+link(PLAN.intro)+'</p><p style="margin-top:8px">'+link(PLAN.versions)+'</p></details>'+html+
 '<h3>Baseline and re-test</h3><p>Record these in session 2 and again in session 9. Film sprints with a phone and time them from the video.</p><table><tr><th>Test</th><th>How</th><th>Week 1</th><th>Week 4</th></tr>'+
 PLAN.baseline.map((b,i)=>'<tr><td>'+esc(b[0])+'</td><td>'+link(b[1])+'</td>'+[1,4].map(wk=>'<td><input inputmode="decimal" data-b="'+i+'.'+wk+'" value="'+esc(S.base[i+'.'+wk]||'')+'" aria-label="'+esc(b[0])+' week '+wk+'"></td>').join('')+'</tr>').join('')+'</table>'+
 '<p style="margin-top:14px"><button class="b" id="planReset">Clear all ticks</button></p>';
 $$('#fTrack button').forEach(b=>b.onclick=()=>{trackF=b.dataset.v;renderPlan()});
 $('#planReset').onclick=()=>{if(confirm('Clear every tick in the plan?')){S.plan={};save();renderPlan()}}}
$('#vPlan').addEventListener('change',e=>{const t=e.target;if(t.dataset.k){S.plan[t.dataset.k]=t.checked;if(!t.checked)delete S.plan[t.dataset.k];save();renderPlan()}else if(t.dataset.b){S.base[t.dataset.b]=t.value;save()}});

/* ---- self-test: window.testAllDrills() loads and samples every drill ---- */
window.testAllDrills=function(){const out=[];for(const d of DRILLS){try{const c=loadDrill(d);let bad=0;for(let t=0;t<=c.dur;t+=c.dur/40){evaluate(t);for(const a of c.list)a.M.root.traverse(o=>{if(isNaN(o.rotation.x+o.rotation.y+o.rotation.z+o.position.x+o.position.y+o.position.z))bad++});if(isNaN(ballMesh.position.x+ballMesh.position.y+ballMesh.position.z))bad++}
  const last=d.anim.phases[d.anim.phases.length-1][1];if(bad)out.push(d.id+': '+bad+' NaN values');if(last>d.anim.dur+1e-6)out.push(d.id+': phase ends after dur')}catch(e){out.push(d.id+': '+e.message)}}
 selectDrill(P.drill.id,{keepView:true,play:false});return out.length?out:'OK: '+DRILLS.length+' drills'};

/* ---- start ---- */
renderList();renderPlan();cam.mode=window.innerWidth<700?'behind':'side';
selectDrill(BYID[S.last]?S.last:DRILLS[0].id,{play:false});
requestAnimationFrame(tick);
</script>
</body>
